  <script>const CART_KEY = 'merkleshop_cart';
window.dataLayer = window.dataLayer || [];

const Cart = {
  get() {
    return JSON.parse(localStorage.getItem(CART_KEY) || '[]');
  },

  save(items) {
    localStorage.setItem(CART_KEY, JSON.stringify(items));
    this.updateBadge();
  },

  add(productId, size, quantity = 1) {
    const items = this.get();
    const existing = items.findIndex(i => i.productId === productId && i.size === size);
    if (existing >= 0) {
      items[existing].quantity += quantity;
    } else {
      items.push({ productId, size, quantity });
    }
    this.save(items);

    const product = PRODUCTS.find(p => p.id === productId);
    if (product) {
      dataLayer.push({ ecommerce: null });
      dataLayer.push({
        event: 'add_to_cart',
        ecommerce: {
          currency: 'EUR',
          value: product.price * quantity,
          items: [{
            item_id: String(product.id),
            item_name: product.name,
            item_category: product.category,
            price: product.price,
            quantity: quantity,
            item_variant: size
          }]
        }
      });
    }
  },

  remove(index) {
    const items = this.get();
    const item = items[index];
    const product = PRODUCTS.find(p => p.id === item.productId);
    if (product) {
      dataLayer.push({ ecommerce: null });
      dataLayer.push({
        event: 'remove_from_cart',
        ecommerce: {
          currency: 'EUR',
          value: product.price * item.quantity,
          items: [{
            item_id: String(product.id),
            item_name: product.name,
            item_category: product.category,
            price: product.price,
            quantity: item.quantity,
            item_variant: item.size
          }]
        }
      });
    }
    items.splice(index, 1);
    this.save(items);
  },

  updateQuantity(index, quantity) {
    const items = this.get();
    if (quantity <= 0) {
      items.splice(index, 1);
    } else {
      items[index].quantity = quantity;
    }
    this.save(items);
  },

  count() {
    return this.get().reduce((sum, i) => sum + i.quantity, 0);
  },

  total() {
    return this.get().reduce((sum, i) => {
      const product = PRODUCTS.find(p => p.id === i.productId);
      return sum + (product ? product.price * i.quantity : 0);
    }, 0);
  },

  getItemsForDL() {
    return this.get().map(i => {
      const p = PRODUCTS.find(p => p.id === i.productId);
      return {
        item_id: String(p.id),
        item_name: p.name,
        item_category: p.category,
        price: p.price,
        quantity: i.quantity,
        item_variant: i.size
      };
    });
  },

  clear() {
    localStorage.removeItem(CART_KEY);
    this.updateBadge();
  },

  updateBadge() {
    const badge = document.getElementById('cart-count');
    if (badge) {
      const count = this.count();
      badge.textContent = count;
      badge.style.display = count > 0 ? 'flex' : 'none';
    }
  }
};

// Format price helper
function formatPrice(n) {
  return '€' + n.toLocaleString('it-IT', { minimumFractionDigits: 0 });
}

document.addEventListener('DOMContentLoaded', () => {
  Cart.updateBadge();
});
</script>
  <script>

    window.dataLayer = window.dataLayer || [];

    const cartItems = Cart.get();
    if (cartItems.length === 0) { window.location.href = 'cart.html'; }

    const subtotal = Cart.total();
    const stdShip = subtotal >= 200 ? 0 : 12;
    let shippingCost = stdShip;

    document.getElementById('std-price').textContent = stdShip === 0 ? 'Free' : '€' + stdShip;

    // Render order summary items
    document.getElementById('sum-items').innerHTML = cartItems.map(item => {
      const p = PRODUCTS.find(p => p.id === item.productId);
      if (!p) return '';
      return `<div style="display:flex;gap:10px;margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--border)">
        <div style="width:56px;flex-shrink:0;aspect-ratio:3/4;background:var(--border);border-radius:3px;overflow:hidden"><img src="${p.image}" alt="${p.name}" style="width:100%;height:100%;object-fit:cover"></div>
        <div style="flex:1"><p style="font-size:13px;font-weight:500;margin-bottom:2px">${p.name}</p><p style="font-size:11px;color:var(--mid)">Size ${item.size} · Qty ${item.quantity}</p></div>
        <p style="font-family:var(--font-display);font-size:15px;font-weight:700;color:var(--blue);white-space:nowrap">${formatPrice(p.price * item.quantity)}</p>
      </div>`;
    }).join('');

    function updateTotals() {
      const total = subtotal + shippingCost;
      document.getElementById('sum-totals').innerHTML = `
        <div class="summary-row"><span>Subtotal</span><span>${formatPrice(subtotal)}</span></div>
        <div class="summary-row"><span>Shipping</span><span>${shippingCost === 0 ? 'Free' : formatPrice(shippingCost)}</span></div>
        <div class="summary-row total"><span>Total</span><span class="amount">${formatPrice(total)}</span></div>`;
    }
    updateTotals();

    document.querySelectorAll('input[name="ship"]').forEach(r => {
      r.addEventListener('change', e => {
        shippingCost = e.target.value === 'express' ? 18 : stdShip;
        document.getElementById('lbl-std').style.border = e.target.value === 'standard' ? '2px solid var(--blue)' : '1px solid var(--border)';
        document.getElementById('lbl-exp').style.border = e.target.value === 'express' ? '2px solid var(--blue)' : '1px solid var(--border)';
        updateTotals();
        dataLayer.push({ ecommerce: null });
        dataLayer.push({ event: 'add_shipping_info', ecommerce: { currency: 'EUR', value: subtotal + shippingCost, shipping_tier: e.target.value, items: Cart.getItemsForDL() } });
      });
    });

    // Card number formatting
    document.getElementById('f-card').addEventListener('input', e => {
      let v = e.target.value.replace(/\D/g,'').substring(0,16);
      e.target.value = v.replace(/(.{4})/g,'$1 ').trim();
    });
    document.getElementById('f-exp').addEventListener('input', e => {
      let v = e.target.value.replace(/\D/g,'').substring(0,4);
      if (v.length >= 2) v = v.substring(0,2) + ' / ' + v.substring(2);
      e.target.value = v;
    });

    function placeOrder() {
      const fields = [
        { id: 'f-email', label: 'Email' },
        { id: 'f-fname', label: 'First Name' },
        { id: 'f-lname', label: 'Last Name' },
        { id: 'f-address', label: 'Address' },
        { id: 'f-city', label: 'City' },
        { id: 'f-zip', label: 'Postal Code' }
      ];
      let valid = true;
      fields.forEach(({ id }) => {
        const el = document.getElementById(id);
        const empty = !el || !el.value.trim();
        if (el) el.style.borderColor = empty ? 'var(--red)' : '';
        if (empty) valid = false;
      });
      if (!valid) {
        document.getElementById('err-msg').style.display = 'block';
        return;
      }
      document.getElementById('err-msg').style.display = 'none';

      const orderId = 'MERKLESHOP-' + Date.now().toString(36).toUpperCase();
      const total = subtotal + shippingCost;
      const order = {
        id: orderId,
        items: Cart.get(),
        subtotal: subtotal,
        shipping: shippingCost,
        total: total,
        email: document.getElementById('f-email').value,
        name: document.getElementById('f-fname').value + ' ' + document.getElementById('f-lname').value,
        date: new Date().toLocaleDateString('it-IT')
      };
      localStorage.setItem('merkleshop_last_order', JSON.stringify(order));
      Cart.clear();
      window.location.href = 'thankyou.html';
    }
  </script>
