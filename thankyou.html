  <script>const CART_KEY = 'merkleshop_cart';
window.dataLayer = window.dataLayer || [];

const Cart = {
  get() {
    return JSON.parse(localStorage.getItem(CART_KEY) || '[]');
  },

  save(items) {
    localStorage.setItem(CART_KEY, JSON.stringify(items));
    this.updateBadge();
  },

  add(productId, size, quantity = 1) {
    const items = this.get();
    const existing = items.findIndex(i => i.productId === productId && i.size === size);
    if (existing >= 0) {
      items[existing].quantity += quantity;
    } else {
      items.push({ productId, size, quantity });
    }
    this.save(items);

    const product = PRODUCTS.find(p => p.id === productId);
    if (product) {
      dataLayer.push({ ecommerce: null });
      dataLayer.push({
        event: 'add_to_cart',
        ecommerce: {
          currency: 'EUR',
          value: product.price * quantity,
          items: [{
            item_id: String(product.id),
            item_name: product.name,
            item_category: product.category,
            price: product.price,
            quantity: quantity,
            item_variant: size
          }]
        }
      });
    }
  },

  remove(index) {
    const items = this.get();
    const item = items[index];
    const product = PRODUCTS.find(p => p.id === item.productId);
    if (product) {
      dataLayer.push({ ecommerce: null });
      dataLayer.push({
        event: 'remove_from_cart',
        ecommerce: {
          currency: 'EUR',
          value: product.price * item.quantity,
          items: [{
            item_id: String(product.id),
            item_name: product.name,
            item_category: product.category,
            price: product.price,
            quantity: item.quantity,
            item_variant: item.size
          }]
        }
      });
    }
    items.splice(index, 1);
    this.save(items);
  },

  updateQuantity(index, quantity) {
    const items = this.get();
    if (quantity <= 0) {
      items.splice(index, 1);
    } else {
      items[index].quantity = quantity;
    }
    this.save(items);
  },

  count() {
    return this.get().reduce((sum, i) => sum + i.quantity, 0);
  },

  total() {
    return this.get().reduce((sum, i) => {
      const product = PRODUCTS.find(p => p.id === i.productId);
      return sum + (product ? product.price * i.quantity : 0);
    }, 0);
  },

  getItemsForDL() {
    return this.get().map(i => {
      const p = PRODUCTS.find(p => p.id === i.productId);
      return {
        item_id: String(p.id),
        item_name: p.name,
        item_category: p.category,
        price: p.price,
        quantity: i.quantity,
        item_variant: i.size
      };
    });
  },

  clear() {
    localStorage.removeItem(CART_KEY);
    this.updateBadge();
  },

  updateBadge() {
    const badge = document.getElementById('cart-count');
    if (badge) {
      const count = this.count();
      badge.textContent = count;
      badge.style.display = count > 0 ? 'flex' : 'none';
    }
  }
};

// Format price helper
function formatPrice(n) {
  return '€' + n.toLocaleString('it-IT', { minimumFractionDigits: 0 });
}

document.addEventListener('DOMContentLoaded', () => {
  Cart.updateBadge();
});
</script>
  <script>

    window.dataLayer = window.dataLayer || [];

    const raw = localStorage.getItem('merkleshop_last_order');
    if (!raw) {
      document.getElementById('order-box').innerHTML = '<p style="text-align:center;font-size:13px;color:var(--mid)">Order details not available. Check your email for confirmation.</p>';
    } else {
      const order = JSON.parse(raw);

      document.getElementById('ty-sub').textContent =
        'Order confirmed! A summary will be sent to ' + order.email;

      const itemsHTML = order.items.map(function(item) {
        const p = PRODUCTS.find(function(p) { return p.id === item.productId; });
        if (!p) return '';
        return '<div class="ty-item"><span class="name">' + p.name + ' <span style="color:var(--mid);font-weight:300">x' + item.quantity + '</span></span><span>' + formatPrice(p.price * item.quantity) + '</span></div>';
      }).join('');

      document.getElementById('order-box').innerHTML =
        '<div class="order-ref">Order <span>' + order.id + '</span> &middot; <span>' + order.date + '</span></div>' +
        itemsHTML +
        '<div class="ty-item"><span>Shipping</span><span>' + (order.shipping === 0 ? 'Free' : formatPrice(order.shipping)) + '</span></div>' +
        '<div class="ty-item" style="font-weight:500;font-size:15px;padding-top:12px;border-bottom:none"><span>Total</span><span style="font-family:var(--font-display);font-size:20px;font-weight:700;color:var(--blue)">' + formatPrice(order.total) + '</span></div>';

      // GA4 purchase event — single source of truth
      const dlItems = order.items.map(function(item) {
        const p = PRODUCTS.find(function(p) { return p.id === item.productId; });
        return { item_id: String(p.id), item_name: p.name, item_category: p.category, price: p.price, quantity: item.quantity };
      });
      dataLayer.push({ ecommerce: null });
      dataLayer.push({
        event: 'purchase',
        ecommerce: {
          transaction_id: order.id,
          value: order.total,
          tax: parseFloat((order.total * 0.22).toFixed(2)),
          shipping: order.shipping,
          currency: 'EUR',
          items: dlItems
        }
      });
    }
  </script>
