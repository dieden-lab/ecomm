  <script>

    window.dataLayer = window.dataLayer || [];

    const raw = localStorage.getItem('merkleshop_last_order');
    if (!raw) {
      document.getElementById('order-box').innerHTML = '<p style="text-align:center;font-size:13px;color:var(--mid)">Order details not available. Check your email for confirmation.</p>';
    } else {
      const order = JSON.parse(raw);

      document.getElementById('ty-sub').textContent =
        'Order confirmed! A summary will be sent to ' + order.email;

      const itemsHTML = order.items.map(function(item) {
        const p = PRODUCTS.find(function(p) { return p.id === item.productId; });
        if (!p) return '';
        return '<div class="ty-item"><span class="name">' + p.name + ' <span style="color:var(--mid);font-weight:300">x' + item.quantity + '</span></span><span>' + formatPrice(p.price * item.quantity) + '</span></div>';
      }).join('');

      document.getElementById('order-box').innerHTML =
        '<div class="order-ref">Order <span>' + order.id + '</span> &middot; <span>' + order.date + '</span></div>' +
        itemsHTML +
        '<div class="ty-item"><span>Shipping</span><span>' + (order.shipping === 0 ? 'Free' : formatPrice(order.shipping)) + '</span></div>' +
        '<div class="ty-item" style="font-weight:500;font-size:15px;padding-top:12px;border-bottom:none"><span>Total</span><span style="font-family:var(--font-display);font-size:20px;font-weight:700;color:var(--blue)">' + formatPrice(order.total) + '</span></div>';

      // GA4 purchase event — single source of truth
      const dlItems = order.items.map(function(item) {
        const p = PRODUCTS.find(function(p) { return p.id === item.productId; });
        return { item_id: String(p.id), item_name: p.name, item_category: p.category, price: p.price, quantity: item.quantity };
      });
      dataLayer.push({ ecommerce: null });
      dataLayer.push({
        event: 'purchase',
        ecommerce: {
          transaction_id: order.id,
          value: order.total,
          tax: parseFloat((order.total * 0.22).toFixed(2)),
          shipping: order.shipping,
          currency: 'EUR',
          items: dlItems
        }
      });
    }
  </script>
