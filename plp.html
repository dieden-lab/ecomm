  <script>

    window.dataLayer = window.dataLayer || [];
    const params = new URLSearchParams(window.location.search);
    const catParam = params.get('cat');
    let activeFilter = catParam || 'All';
    if (catParam) document.getElementById('page-title').textContent = catParam;
    const categories = ['All', ...new Set(PRODUCTS.map(p => p.category))];
    document.getElementById('filter-tags').innerHTML = categories.map(c =>
      `<button class="filter-tag ${c === activeFilter ? 'active' : ''}" onclick="setFilter('${c}')">${c}</button>`
    ).join('');
    function setFilter(cat) {
      activeFilter = cat;
      document.querySelectorAll('.filter-tag').forEach(b => b.classList.toggle('active', b.textContent === cat));
      const u = new URL(window.location); cat === 'All' ? u.searchParams.delete('cat') : u.searchParams.set('cat', cat);
      history.replaceState(null, '', u);
      renderGrid();
    }
    function renderGrid() {
      const filtered = activeFilter === 'All' ? PRODUCTS : PRODUCTS.filter(p => p.category === activeFilter);
      document.getElementById('product-count').textContent = filtered.length + ' products';
      dataLayer.push({ ecommerce: null });
      dataLayer.push({ event: 'view_item_list', ecommerce: { item_list_id: activeFilter.toLowerCase().replace(/ /g,'_'), item_list_name: activeFilter, items: filtered.map((p,i) => ({ item_id: String(p.id), item_name: p.name, item_category: p.category, price: p.price, index: i })) } });
      document.getElementById('product-grid').innerHTML = filtered.map((p,i) => `
        <div class="product-card" onclick="goProduct(${p.id},${i})">
          ${p.new ? '<span class="product-badge">New</span>' : ''}
          <div class="product-img"><img src="${p.image}" alt="${p.name}" loading="lazy"></div>
          <div class="product-info">
            <p class="product-category">${p.category}</p>
            <p class="product-name">${p.name}</p>
            <p class="product-price">${formatPrice(p.price)}</p>
          </div>
        </div>`).join('');
    }
    function goProduct(id, index) {
      const p = PRODUCTS.find(p => p.id === id);
      dataLayer.push({ ecommerce: null });
      dataLayer.push({ event: 'select_item', ecommerce: { item_list_id: activeFilter.toLowerCase().replace(/ /g,'_'), item_list_name: activeFilter, items: [{ item_id: String(p.id), item_name: p.name, item_category: p.category, price: p.price, index }] } });
      window.location.href = 'pdp.html?id=' + id;
    }
    renderGrid();
  </script>
